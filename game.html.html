<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D 城市殭屍大戰 - 電腦滑鼠視角修正版</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #d35400;
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            user-select: none;
        }
        #ui-container {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 20;
        }
        #name-btn {
            margin-top: 8px;
            padding: 6px 12px;
            background: #2ecc71;
            color: white;
            border: 1px solid white;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        #leaderboard-container {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #2ecc71;
            border-radius: 10px;
            padding: 10px 15px;
            color: white;
            font-size: 14px;
            min-width: 150px;
            z-index: 20;
        }
        #leaderboard-container h3 {
            margin: 0 0 8px 0;
            font-size: 15px;
            color: #2ecc71;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 5px;
        }
        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 16px;
            height: 16px;
            transform: translate(-50%, -50%);
            border: 2px solid #2ecc71;
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
        }
        #crosshair::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 4px; height: 4px;
            background: #2ecc71;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }
        /* 電腦版提示 */
        #pc-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 14px;
            pointer-events: none;
            z-index: 10;
            text-align: center;
        }
        #game-over {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #e74c3c; font-size: 36px; font-weight: bold; text-align: center;
            background: rgba(0,0,0,0.9); padding: 25px; border-radius: 15px; z-index: 100;
            border: 2px solid #e74c3c;
        }
        #debug-shield {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: red; color: white;
            padding: 20px; font-size: 20px; font-weight: bold;
            z-index: 9999; display: block; text-align: center;
            border-radius: 10px;
        }
    </style>
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
</head>
<body>

    <div id="debug-shield">⚠️ 3D 引擎載入失敗！</div>

    <div id="ui-container">
        <div>擊退殭屍數: <span id="score-val">0</span></div>
        <div>你的血量: <span id="hp-val">100</span>%</div>
        <div style="margin-top: 5px;">目前玩家: <span id="current-name-val">無名英雄</span></div>
        <button id="name-btn" onclick="changePlayerName(event)">⚙️ 設置名稱</button>
    </div>

    <div id="leaderboard-container">
        <h3>🏆 歷史排行</h3>
        <div id="leaderboard-list"></div>
    </div>

    <div id="crosshair"></div>
    <div id="pc-hint">點擊畫面鎖定滑鼠 即可轉動視角 (ESC退出)</div>

    <div id="game-over">
        腦袋被吃掉了...
        <button onclick="resetGame()" style="margin-top:15px; padding:10px 25px; background:#2ecc71; color:white; border:none; border-radius:5px; cursor:pointer;">再戰一回</button>
    </div>

    <script>
        if (typeof THREE !== 'undefined') {
            document.getElementById('debug-shield').style.display = 'none';
        }

        let scene, camera, renderer;
        let zombies = [], bullets = [];
        let score = 0, hp = 100, isGameOver = false, spawnTimer;
        let gunGroup, muzzleFlash;
        
        // 視角控制變數
        let cameraAngleX = 0, cameraAngleY = 0; 
        const mouseSensitivity = 0.0025; // 滑鼠靈敏度

        // 移動控制變數
        const playerSpeed = 0.16;
        let keyState = { w: false, s: false, a: false, d: false };

        let playerVelocityY = 0, isJumping = false;
        const gravity = -0.012, jumpStrength = 0.26, defaultPlayerHeight = 1.6;
        let walkTime = 0;

        let playerName = localStorage.getItem('zombie_player_name') || '無名英雄';
        document.getElementById('current-name-val').innerText = playerName;

        function changePlayerName(e) {
            e.stopPropagation(); // 防止點擊按鈕時觸發滑鼠鎖定
            const newName = prompt("請輸入你的英勇名稱 (最多 8 個字)：", playerName);
            if (newName && newName.trim() !== "") {
                playerName = newName.trim().substring(0, 8);
                localStorage.setItem('zombie_player_name', playerName);
                document.getElementById('current-name-val').innerText = playerName;
            }
        }

        window.onload = function() {
            if (typeof THREE === 'undefined') return;
            init();
            animate();
        };

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xe67e22);
            scene.fog = new THREE.FogExp2(0xe67e22, 0.01);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
            camera.position.set(0, defaultPlayerHeight, 0); 
            scene.add(camera); 

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, depth: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio || 1); 
            document.body.appendChild(renderer.domElement);

            const gridHelper = new THREE.GridHelper(400, 80, 0x27ae60, 0xffffff);
            gridHelper.position.y = 0.01; 
            scene.add(gridHelper);

            // 正前方大樓
            const tGeo = new THREE.BoxGeometry(8, 25, 8);
            const tMat = new THREE.MeshBasicMaterial({ color: 0x2980b9 });
            const testBuilding = new THREE.Mesh(tGeo, tMat);
            testBuilding.position.set(0, 12.5, -12);
            scene.add(testBuilding);

            // 隨機大樓
            for (let i = 0; i < 30; i++) {
                let h = 15 + Math.random() * 15;
                const bGeo = new THREE.BoxGeometry(6, h, 6);
                const bMat = new THREE.MeshBasicMaterial({ color: 0x2c3e50 });
                const building = new THREE.Mesh(bGeo, bMat);
                let angle = Math.random() * Math.PI * 2;
                let radius = 20 + Math.random() * 60;
                building.position.set(Math.cos(angle) * radius, h / 2, Math.sin(angle) * radius);
                scene.add(building);
            }

            createGun();
            setupPCControls(); // 啟用電腦專用操作
            updateLeaderboardUI();
            window.addEventListener('resize', onWindowResize);
            spawnTimer = setInterval(spawnZombie, 1800);
        }

        function createGun() {
            gunGroup = new THREE.Group();
            
            const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.04, 0.4, 8), new THREE.MeshBasicMaterial({ color: 0x27ae60 }));
            barrel.rotateX(Math.PI / 2); 
            barrel.position.set(0, 0, -0.3);
            gunGroup.add(barrel);

            const bodyGeo = new THREE.BoxGeometry(0.08, 0.08, 0.3);
            const bodyMat = new THREE.MeshBasicMaterial({ color: 0x2c3e50 });
            const gunBody = new THREE.Mesh(bodyGeo, bodyMat);
            gunBody.position.set(0, -0.02, -0.15);
            gunGroup.add(gunBody);

            muzzleFlash = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0 }));
            muzzleFlash.position.set(0, 0, -0.52);
            gunGroup.add(muzzleFlash);

            gunGroup.position.set(0.25, -0.22, -0.45);
            camera.add(gunGroup); 
        }

        // 【核心修正】電腦版專用視角與滑鼠鎖定監聽
        function setupPCControls() {
            const canvasElement = renderer.domElement;

            // 點擊畫面時，請求鎖定滑鼠指標
            canvasElement.addEventListener('click', () => {
                if (!isGameOver) {
                    canvasElement.requestPointerLock();
                }
            });

            // 監聽滑鼠移動事件 (Pointer Lock 觸發後，使用 movementX/Y 計算)
            document.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement === canvasElement && !isGameOver) {
                    cameraAngleX -= e.movementX * mouseSensitivity;
                    // 限制上下看頭的角度，避免翻轉
                    cameraAngleY = Math.max(-Math.PI / 2.5, Math.min(Math.PI / 2.5, cameraAngleY - e.movementY * mouseSensitivity));
                    
                    camera.quaternion.setFromEuler(new THREE.Euler(cameraAngleY, cameraAngleX, 0, 'YXZ'));
                }
            });

            // 鍵盤移動 W A S D 偵測
            window.addEventListener('keydown', (e) => {
                if (isGameOver) return;
                if (e.code === 'KeyW') keyState.w = true;
                if (e.code === 'KeyS') keyState.s = true;
                if (e.code === 'KeyA') keyState.a = true;
                if (e.code === 'KeyD') keyState.d = true;
                if (e.code === 'Space') jump();
            });

            window.addEventListener('keyup', (e) => {
                if (e.code === 'KeyW') keyState.w = false;
                if (e.code === 'KeyS') keyState.s = false;
                if (e.code === 'KeyA') keyState.a = false;
                if (e.code === 'KeyD') keyState.d = false;
            });

            // 滑鼠左鍵開火
            window.addEventListener('mousedown', (e) => {
                if (document.pointerLockElement === canvasElement && e.button === 0) {
                    shoot();
                }
            });
        }

        function jump() { 
            if (!isJumping && !isGameOver) { 
                isJumping = true; 
                playerVelocityY = jumpStrength; 
            } 
        }

        function spawnZombie() {
            if (isGameOver) return;
            const zombieGroup = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.1, 0.7), new THREE.MeshBasicMaterial({ color: 0x556b2f }));
            body.position.y = 0.55; zombieGroup.add(body);
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), new THREE.MeshBasicMaterial({ color: 0x00ff00 }));
            head.position.y = 1.15; zombieGroup.add(head);

            let angle = Math.random() * Math.PI * 2; 
            let distance = 25 + Math.random() * 15;
            zombieGroup.position.set(camera.position.x + Math.cos(angle)*distance, 0, camera.position.z + Math.sin(angle)*distance);
            scene.add(zombieGroup); 
            zombies.push(zombieGroup);
        }

        function shoot() {
            if (isGameOver) return;
            muzzleFlash.material.opacity = 1; 
            gunGroup.position.z = -0.40; 
            setTimeout(() => { 
                muzzleFlash.material.opacity = 0; 
                gunGroup.position.z = -0.45;
            }, 60);

            const bullet = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffff00 }));
            const gunWorldPos = new THREE.Vector3(); 
            muzzleFlash.getWorldPosition(gunWorldPos);
            bullet.position.copy(gunWorldPos);
            
            const targetDir = new THREE.Vector3(); 
            camera.getWorldDirection(targetDir);
            bullet.userData = { dir: targetDir };
            scene.add(bullet); 
            bullets.push(bullet);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (isGameOver) return;

            // 跳躍物理
            if (isJumping) {
                playerVelocityY += gravity; camera.position.y += playerVelocityY;
                if (camera.position.y <= defaultPlayerHeight) { camera.position.y = defaultPlayerHeight; isJumping = false; playerVelocityY = 0; }
            }

            // 根據鍵盤狀態計算移動
            let moveX = 0;
            let moveZ = 0;
            if (keyState.w) moveZ = -1;
            if (keyState.s) moveZ = 1;
            if (keyState.a) moveX = -1;
            if (keyState.d) moveX = 1;

            if (moveX !== 0 || moveZ !== 0) {
                const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion); forward.y = 0; forward.normalize();
                const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion); right.y = 0; right.normalize();
                
                camera.position.addScaledVector(forward, -moveZ * playerSpeed);
                camera.position.addScaledVector(right, moveX * playerSpeed);

                // 槍枝晃動動效
                walkTime += 0.2;
                gunGroup.position.y = -0.22 + Math.sin(walkTime) * 0.015;
                gunGroup.position.x = 0.25 + Math.cos(walkTime) * 0.01;
            }

            // 子彈更新
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i]; b.position.addScaledVector(b.userData.dir, 1.4);
                if (b.position.distanceTo(camera.position) > 80) { scene.remove(b); bullets.splice(i, 1); continue; }
                for (let j = zombies.length - 1; j >= 0; j--) {
                    const z = zombies[j];
                    if (b.position.distanceTo(z.position.clone().setY(0.7)) < 1.3) {
                        scene.remove(z); zombies.splice(j, 1); scene.remove(b); bullets.splice(i, 1);
                        score++; document.getElementById('score-val').innerText = score; break;
                    }
                }
            }

            // 殭屍更新
            for (let j = zombies.length - 1; j >= 0; j--) {
                const z = zombies[j];
                const dir = new THREE.Vector3().copy(camera.position).sub(z.position); dir.y = 0; dir.normalize();
                z.position.addScaledVector(dir, 0.06);
                z.lookAt(camera.position.x, z.position.y, camera.position.z);
                
                if (z.position.distanceTo(new THREE.Vector3(camera.position.x, 0, camera.position.z)) < 2.0) {
                    scene.remove(z); zombies.splice(j, 1); hp -= 20;
                    document.getElementById('hp-val').innerText = Math.max(0, hp);
                    if (hp <= 0) endGame();
                }
            }
            renderer.render(scene, camera);
        }

        function getLeaderboard() { 
            const data = localStorage.getItem('zombie_city_scores'); 
            return data ? JSON.parse(data) : [{name: "生存專家", score: 12}, {name: "王牌射手", score: 6}]; 
        }

        function updateLeaderboardUI() {
            const container = document.getElementById('leaderboard-list'); if(!container) return; container.innerHTML = '';
            getLeaderboard().forEach((item, index) => {
                const div = document.createElement('div'); div.className = 'leaderboard-item';
                div.innerHTML = `<span>${index + 1}. ${item.name}</span><span>${item.score} 隻</span>`; container.appendChild(div);
            });
        }

        function endGame() {
            isGameOver = true; 
            document.getElementById('game-over').style.display = 'block'; 
            clearInterval(spawnTimer);
            document.exitPointerLock(); // 結束時解鎖滑鼠
            
            let list = getLeaderboard();
            list.push({ name: playerName, score: score });
            list.sort((a, b) => b.score - a.score);
            list = list.slice(0, 3);
            localStorage.setItem('zombie_city_scores', JSON.stringify(list));
            updateLeaderboardUI();
        }

        function resetGame() { 
            // 清空舊殭屍與子彈
            zombies.forEach(z => scene.remove(z));
            bullets.forEach(b => scene.remove(b));
            zombies = [];
            bullets = [];
            
            camera.position.set(0, defaultPlayerHeight, 0);
            cameraAngleX = 0; cameraAngleY = 0;
            camera.quaternion.set(0, 0, 0, 1);

            document.getElementById('game-over').style.display = 'none'; 
            hp = 100; score = 0; 
            document.getElementById('hp-val').innerText = hp; 
            document.getElementById('score-val').innerText = score; 
            isGameOver = false; 
            
            clearInterval(spawnTimer);
            spawnTimer = setInterval(spawnZombie, 1800);
        }
        
        function onWindowResize() { if(camera && renderer) { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); } }
    </script>
</body>
</html>
